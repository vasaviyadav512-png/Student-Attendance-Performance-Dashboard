services:
  - type: web
    name: student-attendance-dashboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DB_URL
        fromDatabase:
          name: student-attendance-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: student-attendance-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-attendance-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: student-attendance-db
    databaseName: studentattendance
    user: attendance_app
    plan: free
    region: singapore
